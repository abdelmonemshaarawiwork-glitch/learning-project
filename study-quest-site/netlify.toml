# Static pages (generated by build.py) + the private study planner's functions.
# Deploys publish only the public files (see README → Deploy), never the source.
[build]
  publish = "public"
  command = "python3 build.py && rm -rf public && mkdir public && cp -r index.html 404.html _headers ar agent assets public/ && rm -f public/assets/icons.json"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
